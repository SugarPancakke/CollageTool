<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flex Collage Tool</title>

<style>
body {
  margin: 0;
  background: #391823;
  font-family: Arial;
  display: flex;
  justify-content: center;
  padding: 20px;
  color: white;
}

.container {
  width: 900px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.tool {
  background: #643545;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  width: 100%;
  box-sizing: border-box;
}

h2 {
  margin-bottom: 30px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: #db8b9a;
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
  font-size: 14px;
}

button:hover {
  background: #c06f7f;
}

.button-group {
  display: flex;
  gap: 10px;
}

.pill-group {
  display: flex;
  background: #b06a7a;
  border-radius: 999px;
  overflow: hidden;
}

.pill {
  padding: 6px 12px;
  cursor: pointer;
  background: transparent;
  color: white;
  font-size: 14px;
}

.pill.active {
  background: #db8b9a;
}

canvas {
  display: block;
  transform: scale(0.43);
  transform-origin: center top;
  margin-top: 10px;
}

/* DARK SCROLLBAR */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: #1f1f1f;
}

::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 6px;
}

::-webkit-scrollbar-thumb:hover {
  background: #777;
}

/* Firefox */
* {
  scrollbar-color: #555 #1f1f1f;
}
</style>
</head>

<body>

<div class="container">

  <div class="tool">

    <h2>Flex Collage Tool</h2>

    <div class="controls">
      <input type="file" id="upload" multiple accept="image/*">

      <div class="pill-group" id="colorGroup">
        <div class="pill active" data-value="white">White</div>
        <div class="pill" data-value="dark">Dark</div>
      </div>

      <div class="pill-group" id="opacityGroup">
        <div class="pill" data-value="0.05">5%</div>
        <div class="pill active" data-value="0.1">10%</div>
        <div class="pill" data-value="0.25">25%</div>
      </div>

      <div class="button-group">
        <button onclick="generate()">Generate</button>
        <button onclick="download()">Download PNG</button>
      </div>
    </div>
  </div>

<canvas id="canvas" width="1450" height="1000"></canvas>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const mm = 3.78;
const gap = 2.5 * mm;
const whiteFrame = 3.5 * mm;

const outerTop = 6 * mm;
const outerSide = 6 * mm;
const outerBottom = 18 * mm;

let images = [];
let color = "white";
let opacity = "0.1";

/* DRAG & DROP */
document.addEventListener("dragover", e => e.preventDefault());

document.addEventListener("drop", e => {
  e.preventDefault();

  const files = e.dataTransfer.files;
  if (!files || !files.length) return;

  const input = document.getElementById("upload");

  const dt = new DataTransfer();
  for (const f of files) dt.items.add(f);
  input.files = dt.files;

  generate();
});

/* COLOR PILLS */
document.querySelectorAll("#colorGroup .pill").forEach(pill => {
  pill.onclick = () => {
    document.querySelectorAll("#colorGroup .pill")
      .forEach(p => p.classList.remove("active"));

    pill.classList.add("active");
    color = pill.dataset.value;
  };
});

/* OPACITY PILLS */
document.querySelectorAll("#opacityGroup .pill").forEach(pill => {
  pill.onclick = () => {
    document.querySelectorAll("#opacityGroup .pill")
      .forEach(p => p.classList.remove("active"));

    pill.classList.add("active");
    opacity = pill.dataset.value;
  };
});

/* PLACEHOLDER */
const placeholder = new Image();
placeholder.src = "../image/T_showpic_clothes_blank.png";
  
let placeholderReady = false;
placeholder.onload = () => {
  placeholderReady = true;
};

/* LOAD */
function loadImages(files) {
  return Promise.all([...files].map(file => {
    return new Promise(res => {
      const r = new FileReader();

      r.onload = e => {
        const img = new Image();

        img.onload = () => {
          res({
            img: img,
            name: file.name
          });
        };

        img.src = e.target.result;
      };

      r.readAsDataURL(file);
    });
  }));
}

function safe(item) {
  return item ? item : { img: placeholder, name: "" };
}

async function generate() {
  const files = document.getElementById("upload").files;
  if (!files.length) return alert("Upload images first");

  images = await loadImages(files);
  draw();
}

/* KEEP RATIO */
function drawContain(img, x, y, w) {
  const h = w * (img.height / img.width);
  ctx.drawImage(img, x, y, w, h);
  return h;
}

/* ROW WATERMARK */
function drawRowWatermark(xStart, y, rowWidth) {
  const text = "@eidams_secrets  @eidams_secrets";

  ctx.textAlign = "left";

  let alpha = parseFloat(opacity);

  ctx.fillStyle = color === "white"
    ? `rgba(255,255,255,${alpha})`
    : `rgba(84,84,84,${alpha})`;

  const paddingTop = 85;
  const sidePadding = 25;

  const usableWidth = rowWidth - sidePadding * 2;

  let baseFontSize = 60;
  ctx.font = `bold ${baseFontSize}px Segoe UI`;

  const textWidth = ctx.measureText(text).width;
  const scale = usableWidth / textWidth;
  const finalFontSize = baseFontSize * scale;

  ctx.font = `bold ${finalFontSize}px Segoe UI`;
  ctx.fillText(text, xStart + sidePadding, y + paddingTop);
}

/* DRAW */
function draw() {
  if (!placeholderReady) return;

  const W = canvas.width;
  const total = images.length;
  if (total === 0) return;

  const maxPerRow = 6;

  let rows = Math.ceil(total / maxPerRow);
  let base = Math.floor(total / rows);
  let remainder = total % rows;

  let layout = [];
  for (let i = 0; i < rows; i++) {
    layout.push(i < remainder ? base + 1 : base);
  }

  layout = layout.map(n => Math.min(n, maxPerRow));

  const innerW = W - outerSide * 2;
  const frameW = innerW - whiteFrame * 2;

  let index = 0;
  let rowHeights = [];

  layout.forEach(count => {
    const totalGap = gap * (count - 1);
    const colW = (frameW - totalGap) / count;

    let maxH = 0;

    for (let i = 0; i < count; i++) {
      const item = safe(images[index++]);
      const h = colW * (item.img.height / item.img.width);

      if (h > maxH) maxH = h;
    }

    rowHeights.push(maxH);
  });

  const totalHeight =
    rowHeights.reduce((a, b) => a + b, 0) +
    gap * (rows - 1) +
    outerTop +
    outerBottom +
    whiteFrame * 2;

  canvas.height = totalHeight;

  ctx.fillStyle = "#fde8e8";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";
  ctx.fillRect(
    outerSide,
    outerTop,
    canvas.width - outerSide * 2,
    canvas.height - outerTop - outerBottom
  );

  const frameX = outerSide + whiteFrame;
  let yCursor = outerTop + whiteFrame;

  index = 0;

  layout.forEach((count, rowIndex) => {
    const rowH = rowHeights[rowIndex];

    const totalGap = gap * (count - 1);
    const colW = (frameW - totalGap) / count;

    let offsetX = 0;

    if (count < maxPerRow) {
      const used = colW * count + totalGap;
      offsetX = (frameW - used) / 2;
    }

    const rowStartX = frameX + offsetX;
    const rowWidth = colW * count + gap * (count - 1);

    for (let i = 0; i < count; i++) {
      const x = frameX + offsetX + i * (colW + gap);

      const item = safe(images[index++]);

      /* draw blank underneath ONLY for suit images */
      if (item.name.startsWith("T_showpic_suit_")) {
        drawContain(placeholder, x, yCursor, colW);
      }

      /* actual image */
      drawContain(item.img, x, yCursor, colW);
    }

    drawRowWatermark(rowStartX, yCursor, rowWidth);

    yCursor += rowH + gap;
  });

  ctx.fillStyle = "rgba(194,60,60,0.45)";
  ctx.font = "bold 40px 'Segoe UI'";
  ctx.textAlign = "center";

  ctx.fillText(
    "@eidams_secrets  @eidams_secrets",
    canvas.width / 2,
    canvas.height - (outerBottom / 2) + 15
  );
}

/* DOWNLOAD */
function download() {
  const link = document.createElement("a");
  link.download = "collage.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
