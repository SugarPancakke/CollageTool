<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deep Echoes Collage</title>

<style>
body {
  margin: 0;
  background: #391823;
  font-family: Arial;
  display: flex;
  justify-content: center;
  padding: 20px;
  color: white;
}

.container {
  width: 900px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.tool {
  background: #643545;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  width: 100%;
  box-sizing: border-box;
}

h2 {
  margin-bottom: 30px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: nowrap; 
  align-items: center;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: #db8b9a;
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
  font-size: 14px;
  white-space: nowrap; 
}

button:hover {
  background: #c06f7f;
}

.button-group {
  display: flex;
  gap: 10px;
}

canvas {
  display: block;
  transform: scale(0.43);
  transform-origin: center top;
  margin-top: 10px;
}

/* DARK SCROLLBAR */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: #1f1f1f;
}

::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 6px;
}

::-webkit-scrollbar-thumb:hover {
  background: #777;
}

/* Firefox */
* {
  scrollbar-color: #555 #1f1f1f;
}
</style>

</head>

<body>

<div class="container">

  <div class="tool">

    <h2>Deep Echoes Collage</h2>

    <div class="controls">

      <input type="file" id="upload" multiple accept="image/*">

      <div class="button-group">
        <button onclick="generate()">Generate</button>
        <button onclick="download()">Download PNG</button>
      </div>

    </div>
  </div>

<canvas id="canvas" width="2500" height="1220"></canvas>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const mm = 3.78;
const gap = 2.5 * mm;
const whiteFrame = 3.5 * mm;

const outerTop = 6 * mm;
const outerSide = 6 * mm;
const outerBottom = 18 * mm;

let images = [];

const getImageIndex = (r, c) => {
  return r === 0 ? c * 2 : c * 2 + 1;
};

/* DRAG & DROP */
document.addEventListener("dragover", e => e.preventDefault());

document.addEventListener("drop", e => {
  e.preventDefault();

  const files = e.dataTransfer.files;
  if (!files || !files.length) return;

  const input = document.getElementById("upload");

  const dt = new DataTransfer();
  for (const f of files) dt.items.add(f);
  input.files = dt.files;

  generate();
});

/* PLACEHOLDER */
const placeholder = new Image();
placeholder.src = "../image/T_showpic_clothes_blank.png";

let placeholderReady = false;
placeholder.onload = () => {
  placeholderReady = true;
  draw();
};

/* LOAD */
function loadImages(files) {
  return Promise.all([...files].map(file => {
    return new Promise(res => {
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => res(img);
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });
  }));
}

function drawCover(img, x, y, w, h) {
  const scale = Math.max(w / img.width, h / img.height);
  const sw = w / scale;
  const sh = h / scale;

  const sx = (img.width - sw) / 2;
  const sy = (img.height - sh) / 2;

  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function safe(img) {
  return img ? img : placeholder;
}

function drawLabel(text, x, y) {
  ctx.fillStyle = "rgba(230, 170, 170, 1)";
  ctx.font = "bold 50px Segoe UI";
  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  ctx.fillText(text, x + 12, y + 12);
}

async function generate() {
  const files = document.getElementById("upload").files;
  if (!files.length) return alert("Upload images first");

  images = await loadImages(files);

  while (images.length < 12) {
    images.push(null);
  }

  draw();
}

function draw() {
  if (!placeholderReady) return;

  const W = canvas.width;
  const H = canvas.height;

  ctx.fillStyle = "#fde8e8";
  ctx.fillRect(0, 0, W, H);

  const innerX = outerSide;
  const innerY = outerTop;
  const innerW = W - outerSide * 2;
  const innerH = H - outerTop - outerBottom;

  ctx.fillStyle = "white";
  ctx.fillRect(innerX, innerY, innerW, innerH);

  const frameX = innerX + whiteFrame;
  const frameY = innerY + whiteFrame;
  const frameW = innerW - whiteFrame * 2;
  const frameH = innerH - whiteFrame * 2;

  const cols = 6;
  const rows = 2;

  const colW = (frameW - gap * (cols - 1)) / cols;
  const rowH = (frameH - gap * (rows - 1)) / rows;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {

      const imgIndex = getImageIndex(r, c);

      const x = frameX + c * (colW + gap);
      const y = frameY + r * (rowH + gap);

      drawCover(
        safe(images[imgIndex]),
        x,
        y,
        colW,
        rowH
      );
    }
  }

  drawLabel("Base:", frameX + 15, frameY + 15);
  drawLabel("Glow-up:", frameX + 15, frameY + rowH + gap + 15);

  const overlayText = "@eidams_secrets  @eidams_secrets  @eidams_secrets";

  ctx.fillStyle = "rgba(255,255,255,0.20)";
  ctx.textAlign = "center";
  ctx.font = "bold 79px 'Segoe UI'";

  const offset = 85;

  const positions = [
    frameY + rowH - offset,
    frameY + rowH + gap + rowH - offset
  ];

  positions.forEach(y => {
    ctx.fillText(overlayText, frameX + frameW / 2, y);
  });

  const text = "@eidams_secrets  @eidams_secrets  @eidams_secrets";

  ctx.fillStyle = "rgba(194,60,60,0.45)";
  ctx.font = "bold 40px 'Segoe UI'";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  let yText = H - (outerBottom / 2) + 15;

  if (yText > H - 10) yText = H - 10;
  if (yText < 40) yText = 40;

  ctx.fillText(text, W / 2, yText);
}

function download() {
  const link = document.createElement("a");
  link.download = "collage.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
