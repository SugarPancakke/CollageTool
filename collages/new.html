<!DOCTYPE html>
<html>
<head>
    <title>Bulk WebP → PNG</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <input type="file" id="files" accept=".webp,image/webp" multiple>
    <button id="convert">Convert & Download ZIP</button>

    <script>
        document.getElementById("convert").onclick = async () => {
            const files = document.getElementById("files").files;

            if (!files.length) {
                alert("Select some WebP files first.");
                return;
            }

            const zip = new JSZip();

            for (const file of files) {
                const img = new Image();
                img.src = URL.createObjectURL(file);

                await new Promise(resolve => {
                    img.onload = resolve;
                });

                const canvas = document.createElement("canvas");
                canvas.width = img.width;
                canvas.height = img.height;

                canvas.getContext("2d").drawImage(img, 0, 0);

                const blob = await new Promise(resolve =>
                    canvas.toBlob(resolve, "image/png")
                );

                zip.file(
                    file.name.replace(/\.webp$/i, ".png"),
                    blob
                );

                URL.revokeObjectURL(img.src);
            }

            const zipBlob = await zip.generateAsync({ type: "blob" });

            const a = document.createElement("a");
            a.href = URL.createObjectURL(zipBlob);
            a.download = "converted_pngs.zip";
            a.click();

            URL.revokeObjectURL(a.href);
        };
    </script>
</body>
</html>
